<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f6f53" />
  <title>Farmacias 3D Lima · Setiembre 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "camera-controls": "https://esm.sh/camera-controls@3.1.2?external=three"
      }
    }
  </script>
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div class="hero-copy">
        <span class="eyebrow">Visualización operativa</span>
        <div class="title-row">
          <h1>Farmacias en Lima</h1>
          <span class="period-pill">Setiembre 2026</span>
        </div>
        <p>Ventas reales de farmacia por sede y dosis · traspasos internos excluidos.</p>
      </div>

      <div class="location-cards">
        <button class="location-card" type="button" data-focus-site="CIDON" title="Enfocar CIDON Lince">
          <span class="pin">●</span>
          <div>
            <strong>CIDON · Lince</strong>
            <small>324 unidades · S/ 434,885.48</small>
          </div>
        </button>
        <button class="location-card" type="button" data-focus-site="CIATOB" title="Enfocar CIATOB Surco">
          <span class="pin">●</span>
          <div>
            <strong>CIATOB · Surco</strong>
            <small>209 unidades · S/ 270,540.20</small>
          </div>
        </button>
      </div>
    </header>

    <section class="viewer" aria-label="Visualización 3D de farmacias y ventas de setiembre 2026">
      <div id="scene"></div>
      <div class="scene-badge">Lima · Perú · Setiembre 2026</div>
      <button class="reset-view" id="reset-view" type="button">Vista general</button>
      <div class="controls-hint">Arrastra: rotar · clic derecho: mover · rueda: zoom al cursor · doble clic: enfocar sede</div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
